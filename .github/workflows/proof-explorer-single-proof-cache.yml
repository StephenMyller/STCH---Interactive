name: Proof Explorer - single-proof Lwarp cache (D.2)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Extract Metatheorem D.2 into a standalone Lwarp document
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re
          import shutil

          root = Path.cwd()
          out = root / 'proof-isolate'
          out.mkdir(exist_ok=True)
          identifier = 'meta:restricted-unrestricted-class-formulation'
          pattern = re.compile(r'\\begin\{explorerderivation\}\{([^{}\r\n]+)\}(.*?)\\end\{explorerderivation\}', re.S)
          found = []
          for path in sorted((root / 'Chapters').rglob('*.tex')):
              text = path.read_text(encoding='utf-8')
              for match in pattern.finditer(text):
                  if match.group(1).strip() == identifier:
                      found.append((path, match))
          if len(found) != 1:
              raise SystemExit(f'Expected exactly one {identifier}, found {len(found)}')
          source_path, match = found[0]
          body = match.group(2)
          if len(re.findall(r'\\begin\{prooftree\}', body)) != 1 or len(re.findall(r'\\end\{prooftree\}', body)) != 1:
              raise SystemExit('Selected environment must have exactly one complete prooftree')
          full = match.group(0)
          shutil.copyfile(root / 'preamble.tex', out / 'preamble.tex')
          (out / 'main.tex').write_text(
              '\\documentclass[leqno]{article}\n\\input{preamble}\n\\begin{document}\n'
              + full + '\n\\end{document}\n', encoding='utf-8')
          (out / 'specimen.json').write_text(json.dumps({
              'id': identifier, 'source_file': str(source_path.relative_to(root)),
              'source_characters': len(full)
          }, indent=2) + '\n', encoding='utf-8')
          print(f'ISOLATION: extracted {identifier} from {source_path.relative_to(root)}; {len(full)} characters')
          print('ISOLATION: source files untouched; standalone build at proof-isolate/main.tex')
          PY

      - name: Prepare robust Explorer HTML extractor
        run: |
          cat > proof-isolate/html_proof.py <<'PYPROOF'
          from dataclasses import dataclass
          from html import unescape
          import re

          @dataclass(frozen=True)
          class ProofBlock:
              source: str
              begin: int
              finish: int

              def start(self):
                  return self.begin

              def end(self):
                  return self.finish

              def group(self, number=0):
                  if number != 0:
                      raise ValueError('Only the complete proof block is supported')
                  return self.source[self.begin:self.finish]

          OPEN = re.compile(r'<div\b[^>]*>', re.I | re.S)
          CLASS = re.compile(r"\bclass\s*=\s*([\"'])(.*?)\1", re.I | re.S)
          DIV = re.compile(r'<!--.*?-->|<\s*(/?)\s*div\b[^>]*>', re.I | re.S)
          START = re.compile(r'\\begin\s*\{prooftree\}')
          END = re.compile(r'\\end\s*\{prooftree\}')

          def explorer_blocks(source):
              for opening in OPEN.finditer(source):
                  tag = opening.group(0)
                  match = CLASS.search(tag)
                  if not match or 'explorerderivation' not in unescape(match.group(2)).split():
                      continue
                  depth = 1
                  finish = None
                  for token in DIV.finditer(source, opening.end()):
                      if token.group(0).startswith('<!--'):
                          continue
                      depth += -1 if token.group(1) else 1
                      if depth == 0:
                          finish = token.end()
                          break
                  if finish is None:
                      raise ValueError('Unclosed explorerderivation HTML element')
                  yield ProofBlock(source, opening.start(), finish)

          def find_proof_block(source, where, identifier):
              blocks = list(explorer_blocks(source))
              # The opening element owns --explorer-id; allow harmless whitespace
              # and HTML entity differences introduced by Lwarp.
              targets = [block for block in blocks
                         if identifier in unescape(block.source[block.start():
                                                              block.source.find('>', block.start()) + 1])]
              if not targets and len(blocks) == 1:
                  print(f'PROOF EXTRACTION: {where}: identifier spelling differs; '
                        'using the only explorerderivation element')
                  targets = blocks
              if len(targets) != 1:
                  examples = [unescape(block.source[block.start():
                                                   block.source.find('>', block.start()) + 1])[:230]
                              for block in blocks[:4]]
                  raise ValueError(f'{where}: expected one proof element for {identifier}; '
                                   f'found {len(targets)} matching, {len(blocks)} total. '
                                   f'Opening elements: {examples}')
              block = targets[0]
              body = block.group(0)
              starts = list(START.finditer(body))
              ends = list(END.finditer(body))
              if len(starts) != 1 or len(ends) != 1 or starts[0].start() >= ends[0].start():
                  raise ValueError(f'{where}: expected one complete prooftree in '
                                   f'the chosen element; got {len(starts)} beginnings '
                                   f'and {len(ends)} endings')
              return block
          PYPROOF

      - name: Compute content-based proof cache key
        id: fingerprint
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os
          import re

          project = Path.cwd()
          work = project / 'proof-isolate'
          workflow = project / '.github/workflows/proof-explorer-single-proof-cache.yml'
          inputs = [work / 'main.tex', work / 'preamble.tex', workflow]

          # Also account for local package/configuration files and any LaTeX files
          # imported from the preamble. Do not hash unrelated chapters.
          inputs += [p for suffix in ('*.sty', '*.cls', '*.cfg', '*.def')
                     for p in project.glob(suffix)]
          pending = [project / 'preamble.tex']
          scanned = set()
          while pending:
              current = pending.pop()
              if current in scanned:
                  continue
              scanned.add(current)
              source = current.read_text(encoding='utf-8')
              for item in re.findall(r'\\(?:input|include)\s*\{([^{}]+)\}', source):
                  target = current.parent / item
                  if not target.suffix:
                      target = target.with_suffix('.tex')
                  if target.is_file() and target.is_relative_to(project):
                      inputs.append(target)
                      pending.append(target)
          inputs = sorted(set(inputs))
          missing = [str(p) for p in inputs if not p.is_file()]
          if missing:
              raise SystemExit('CACHE: required input missing: ' + ', '.join(missing))

          digest = hashlib.sha256()
          for path in inputs:
              name = path.relative_to(project).as_posix().encode()
              data = path.read_bytes()
              digest.update(len(name).to_bytes(4, 'big'))
              digest.update(name)
              digest.update(len(data).to_bytes(8, 'big'))
              digest.update(data)
          # Version is intentionally explicit, to invalidate all old fragments if
          # we change the extraction/compilation contract later.
          cache_key = 'stch-d2-isolated-lwarp-v1-' + digest.hexdigest()
          (work / 'cache-fingerprint.json').write_text(
              json.dumps({'key':cache_key, 'inputs':[str(p.relative_to(project))
                                                     for p in inputs]}, indent=2)+'\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              print('cache_key=' + cache_key, file=output)
          print('CACHE FINGERPRINT:',cache_key)
          print('CACHE INPUTS:', ', '.join(str(p.relative_to(project)) for p in inputs))
          PY

      - name: Restore compiled D.2 proof from GitHub Actions cache
        id: proof-cache
        uses: actions/cache/restore@v4
        with:
          key: ${{ steps.fingerprint.outputs.cache_key }}
          path: |
            proof-isolate/index.html
            proof-isolate/lwarp.css
            proof-isolate/lwarp_formal.css
            proof-isolate/lwarp_sagebrush.css
            proof-isolate/sample_project.css
            proof-isolate/cache-manifest.json

      - name: Report whether the proof was cached
        env:
          CACHE_HIT: ${{ steps.proof-cache.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = "true" ]; then
            echo 'CACHE HIT: Exact D.2 fingerprint found. LaTeX/Lwarp compilation will be SKIPPED.'
          else
            echo 'CACHE MISS: No matching D.2 fragment. LaTeX/Lwarp compilation is required once.'
          fi

      - name: Preflight published proof and registry before compiling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import html
          import re
          import os
          import time
          from urllib.error import HTTPError, URLError
          from urllib.parse import urljoin, urlsplit, urldefrag
          from urllib.request import Request, urlopen

          site = os.environ.get('STCH_SITE_URL', 'https://stephenmyller.github.io/STCH---Interactive/').rstrip('/') + '/'
          work = Path('proof-isolate')
          work.mkdir(exist_ok=True)
          identifier = 'meta:restricted-unrestricted-class-formulation'

          def fetch(relative):
              url = urljoin(site, relative)
              print(f'PREFLIGHT: GET {url}', flush=True)
              try:
                  req = Request(url, headers={'User-Agent': 'STCH-proof-comparison/1.1'})
                  with urlopen(req, timeout=16) as response:
                      data = response.read()
                  print(f'PREFLIGHT: OK {len(data):,} bytes: {url}', flush=True)
                  return data
              except HTTPError as exc:
                  print(f'PREFLIGHT: HTTP {exc.code}: {url}', flush=True)
                  return None
              except (URLError, TimeoutError, OSError) as exc:
                  print(f'PREFLIGHT: failed {url}: {exc}', flush=True)
                  return None

          home = fetch('index.html')
          registry = fetch('assets/proof-rules.json')
          if not home or not registry:
              raise SystemExit('PREFLIGHT FAILED: published index.html or proof registry is unavailable. No LaTeX compilation was started.')
          (work / 'published-index.html').write_bytes(home)
          (work / 'published-proof-rules.json').write_bytes(registry)

          # Use the actual navigation links where available instead of assuming Lwarp's
          # current page filenames. Try likely filenames first to reduce web requests.
          candidates = [
              'Class-Formation-Syntax.html',
              'Restricted-and-Unrestricted-Membership-Specifications.html',
              'Technical-Appendix.html',
              'The-Class-Term-Extension-Metatheorem.html',
          ]
          for link in re.findall(r"""\bhref\s*=\s*['"]([^'"]+)['"]""", home.decode('utf-8', 'replace'), re.I):
              link = html.unescape(link)
              dest = urlsplit(urljoin(site, link))
              base = urlsplit(site)
              if dest.netloc == base.netloc and dest.path.startswith(base.path) and dest.path.lower().endswith('.html'):
                  candidates.append(dest.path[len(base.path):])

          # Last-resort candidates from recent published artifact filenames; these are
          # only tried if the preferred page is not found.
          candidates += [
              'Class-Term-Syntax-Contextual-Elimination.html',
              'Definitions-as-Extended-Syntax.html',
              'Axiom-Class-Formation.html',
              'Fundamental-Class-Builder-Laws.html',
              'Class-Builder-Notation.html',
              'Extended-Term-Substitution-Admissibility.html',
          ]
          seen = set()
          found = None
          for candidate in candidates:
              if candidate in seen or '..' in candidate.split('/'):
                  continue
              seen.add(candidate)
              body = fetch(candidate)
              if not body:
                  continue
              content = body.decode('utf-8', 'replace')
              if identifier in content and 'explorerderivation' in content and r'\begin{prooftree}' in content:
                  found = (candidate, body)
                  break

          if not found:
              raise SystemExit(
                  'PREFLIGHT FAILED: the published website does not currently expose the D.2 '
                  'Explorer derivation. Checked: ' + ', '.join(seen) + '. '
                  'No LaTeX compilation was started.'
              )
          page, content = found
          (work / 'published-Class-Formation-Syntax.html').write_bytes(content)
          (work / 'published-source-page.txt').write_text(page + '\n', encoding='utf-8')
          print(f'PREFLIGHT: found D.2 on published page {page}', flush=True)

          # Check that we are comparing the same number of steps before an expensive
          # isolated compilation. A changed published page would be an unfair comparison.
          import sys
          sys.path.insert(0, str(work.resolve()))
          from html_proof import find_proof_block
          source = (work / 'main.tex').read_text(encoding='utf-8')
          cmd = r'\\(?:AxiomC|UnaryInfC|BinaryInfC|TrinaryInfC|QuaternaryInfC|QuinaryInfC)\b'
          source_count = len(re.findall(cmd, source))
          try:
              published_block = find_proof_block(content.decode('utf-8', 'replace'),
                                                 'published D.2 page', identifier)
          except ValueError as exc:
              raise SystemExit(f'PREFLIGHT FAILED: {exc}. No LaTeX compilation was started.')
          published_count = len(re.findall(cmd, published_block.group(0)))
          if source_count != published_count:
              raise SystemExit(f'PREFLIGHT FAILED: repository proof has {source_count} inference commands; '
                               f'published proof has {published_count}. No LaTeX compilation was started.')
          print(f'PREFLIGHT OK: both proofs have {source_count} inference commands. Cached proof or build will be validated next.', flush=True)
          PY

      - name: Compile isolated proof with the normal Lwarp process
        if: steps.proof-cache.outputs.cache-hit != 'true'
        uses: xu-cheng/texlive-action@v3
        with:
          os: alpine
          run: |
            set -eo pipefail
            apk add --no-cache poppler-utils ghostscript
            cd proof-isolate
            last=$(date +%s)
            mark() {
              now=$(date +%s)
              echo "TIMING: $1 — $((now - last)) seconds"
              last="$now"
            }
            pdflatex -interaction=nonstopmode -halt-on-error main.tex > pdf-build.log 2>&1 || { tail -100 pdf-build.log; exit 1; }
            mark "PDF pre-pass"
            lwarpmk html1 > first-html.log 2>&1 || { tail -100 first-html.log; exit 1; }
            mark "First isolated HTML pass"
            lwarpmk html1 > second-html.log 2>&1 || { tail -100 second-html.log; exit 1; }
            mark "Second isolated HTML pass"
            lwarpmk limages > images.log 2>&1 || { tail -100 images.log; exit 1; }
            mark "Lwarp image step"
            lwarpmk html > final-html.log 2>&1 || { tail -100 final-html.log; exit 1; }
            mark "Final Lwarp HTML step"
            test -s index.html || { echo "No compiled proof index.html"; exit 1; }

      - name: Verify the cached or freshly compiled proof and its checksums
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import re
          import sys

          work = Path('proof-isolate')
          fingerprint = json.loads((work/'cache-fingerprint.json').read_text())
          paths = ['index.html', 'lwarp.css', 'lwarp_formal.css',
                   'lwarp_sagebrush.css', 'sample_project.css']
          contents = {}
          for name in paths:
              file = work/name
              if not file.is_file() or file.stat().st_size == 0:
                  raise SystemExit(f'CACHE VERIFICATION FAILED: {file} missing or empty')
              contents[name] = hashlib.sha256(file.read_bytes()).hexdigest()

          sys.path.insert(0,str(work.resolve()))
          from html_proof import find_proof_block
          identifier = 'meta:restricted-unrestricted-class-formulation'
          block = find_proof_block((work/'index.html').read_text(encoding='utf-8'),
                                   'cached/compiled D.2',identifier)
          commands = r'\\(?:AxiomC|UnaryInfC|BinaryInfC|TrinaryInfC|QuaternaryInfC|QuinaryInfC)\b'
          compiled_count = len(re.findall(commands,block.group(0)))
          source_count = len(re.findall(commands,(work/'main.tex').read_text()))
          if compiled_count != source_count or compiled_count < 30:
              raise SystemExit(f'CACHE VERIFICATION FAILED: source has {source_count} '
                               f'inferences but fragment has {compiled_count}')

          manifest_path = work/'cache-manifest.json'
          expected = {'key':fingerprint['key'], 'files':contents,
                      'inference_commands':compiled_count}
          if manifest_path.exists():
              saved = json.loads(manifest_path.read_text(encoding='utf-8'))
              if saved != expected:
                  raise SystemExit('CACHE VERIFICATION FAILED: restored manifest or checksums differ')
              print(f'CACHE VERIFIED: restored fragment matches SHA-256 checksums; {compiled_count} inferences')
          else:
              manifest_path.write_text(json.dumps(expected,indent=2)+'\n',encoding='utf-8')
              print(f'CACHE VERIFIED: freshly compiled fragment; {compiled_count} inferences; manifest written')
          PY

      - name: Save compiled D.2 proof for subsequent runs
        if: steps.proof-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.fingerprint.outputs.cache_key }}
          path: |
            proof-isolate/index.html
            proof-isolate/lwarp.css
            proof-isolate/lwarp_formal.css
            proof-isolate/lwarp_sagebrush.css
            proof-isolate/sample_project.css
            proof-isolate/cache-manifest.json

      - name: Reuse stylesheets generated by the isolated Lwarp build
        run: |
          set -euo pipefail
          mkdir -p proof-comparison
          for file in lwarp.css lwarp_formal.css lwarp_sagebrush.css sample_project.css; do
            if [ -f "proof-isolate/$file" ]; then
              cp "proof-isolate/$file" "proof-comparison/$file"
              echo "STYLESHEET: $file from isolated Lwarp output"
            else
              echo "ERROR: isolated Lwarp did not generate $file"
              exit 1
            fi
          done

      - name: Place isolated and published proofs into identical textbook pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import html
          import json
          import re
          import shutil
          from urllib.parse import quote, urljoin

          root = Path.cwd()
          work = root / 'proof-isolate'
          out = root / 'proof-comparison'
          out.mkdir(exist_ok=True)
          site = 'https://stephenmyller.github.io/STCH---Interactive/'
          identifier = 'meta:restricted-unrestricted-class-formulation'

          import sys
          sys.path.insert(0, str(work.resolve()))
          from html_proof import find_proof_block

          new_compiled = (work / 'index.html').read_text(encoding='utf-8')
          original = (work / 'published-Class-Formation-Syntax.html').read_text(encoding='utf-8')
          original_home = (work / 'published-index.html').read_text(encoding='utf-8')
          index_match = re.search(r'<script\s+id="gentzen-reference-index"\s+type="application/json">(.*?)</script>', original_home, re.S)
          if not index_match:
              raise SystemExit('Published index.html lacks gentzen-reference-index')
          index = json.loads(index_match.group(1))
          if not isinstance(index, dict):
              raise SystemExit('Unexpected reference index structure')

          compiled_match = find_proof_block(new_compiled, 'standalone Lwarp output', identifier)
          published_match = find_proof_block(original, 'published Class Formation page', identifier)
          compiled = compiled_match.group(0)
          published = published_match.group(0)

          # Resolve references within the isolated fragment exactly as in the main
          # publication's postprocessing step, then make the links work under file://.
          missing = set()
          reference_count = 0

          def fix_ref(match):
              global reference_count
              label = match.group(1)
              value = index.get(label)
              if not isinstance(value, list) or len(value) != 2:
                  missing.add(label)
                  return match.group(0)
              number, page = value
              reference_count += 1
              return r'\href{' + urljoin(site, page+'#'+quote(label, safe=':-._')) + '}{' + str(number) + '}'

          compiled = re.sub(r'\\ref\s*\{\s*([^{}\s]+)\s*\}', fix_ref, compiled)
          if missing:
              raise SystemExit('Unresolved numbered references: ' + ', '.join(sorted(missing)))

          # Convert resolved hyperlinks from the published original to absolute URLs,
          # preserving the original math commands and visual typography.
          def absolutize(fragment):
              def replace(match):
                  address = match.group(1)
                  if address.startswith('#proof-expand-'):
                      return match.group(0)
                  if not (address.startswith('#') or address.startswith('http:') or address.startswith('https:') or address.endswith('.html') or '.html#' in address):
                      return match.group(0)
                  return r'\href{' + urljoin(site + (work / 'published-source-page.txt').read_text(encoding='utf-8').strip(), address) + '}{'
              return re.sub(r'\\href\s*\{([^{}]+)\}\s*\{', replace, fragment)

          compiled = absolutize(compiled)
          published = absolutize(published)

          # Bundle existing (not rewritten) site assets, with one CORS-safe registry
          # loader for files opened directly from a downloaded ZIP.
          shutil.copytree(root / 'assets', out / 'assets', dirs_exist_ok=True)
          js = (root / 'assets/gentzen.js').read_text(encoding='utf-8')
          needle = "const response = await fetch(url, {cache: 'no-store'});"
          if js.count(needle) != 1:
              raise SystemExit('Explorer registry loader changed; cannot safely patch experiment')
          js = js.replace(needle,
             "const response = window.__STCH_POC_REGISTRY ? "
             "{ok: true, json: async () => window.__STCH_POC_REGISTRY} "
             ": await fetch(url, {cache: 'no-store'});", 1)
          link_setting = "anchor.setAttribute('href', destination.content);"
          if js.count(link_setting) != 1:
              raise SystemExit('Explorer label-link handler has changed')
          js = js.replace(link_setting,
              "anchor.setAttribute('href', destination.content.startsWith('#proof-expand-') "
              "? destination.content : new URL(destination.content, 'https://stephenmyller.github.io/STCH---Interactive/').href);", 1)
          (out / 'poc-gentzen.js').write_text(js, encoding='utf-8')
          registry = json.loads((work / 'published-proof-rules.json').read_text(encoding='utf-8'))
          inline_registry = json.dumps(registry, ensure_ascii=False).replace('</','<\\/')

          published_with_abs = original[:published_match.start()] + published + original[published_match.end():]
          compiled_injected = original[:published_match.start()] + compiled + original[published_match.end():]

          def make_page(source):
              # Use the same HTML and MathJax configuration as the live textbook.
              script = ('<script id="stch-poc-registry" type="application/json">' + inline_registry + '</script>\n'
                        '<script>window.__STCH_POC_REGISTRY = JSON.parse(document.getElementById("stch-poc-registry").textContent);</script>\n')
              source = source.replace('</head>', script + '</head>', 1)
              source, changed = re.subn(r'(<script\b[^>]*\bsrc=["\'])assets/gentzen\.js(?:\?[^"\']*)?(["\'])',
                                        r'\1poc-gentzen.js\2', source)
              if changed != 1:
                  raise SystemExit(f'Expected one gentzen.js script tag; found {changed}')
              return source

          (out / 'original.html').write_text(make_page(published_with_abs), encoding='utf-8')
          (out / 'isolated.html').write_text(make_page(compiled_injected), encoding='utf-8')
          (out / 'fragment-published.html').write_text(published, encoding='utf-8')
          (out / 'fragment-isolated.html').write_text(compiled, encoding='utf-8')
          shutil.copyfile(work / 'main.tex', out / 'isolated-main.tex.txt')

          # A simple entry page opens either version in the *same* Explorer mode.
          query = '?proof-explorer=' + quote(identifier, safe=':-._')
          index_html = f'''<!doctype html><html lang="en"><head><meta charset="utf-8">
          <title>STCH isolated Lwarp proof comparison</title>
          <style>body{{font:17px/1.6 Georgia,serif;max-width:760px;margin:5rem auto;padding:0 2rem;background:#f7f5f0;color:#242424}}
          a{{display:inline-block;padding:.65rem 1rem;margin:.5rem .3rem .5rem 0;border:1px solid #999;border-radius:4px;color:inherit}}
          code{{font-size:.85em}}p{{margin:1rem 0}}</style></head><body>
          <h1>Metatheorem D.2 — isolated Lwarp comparison</h1>
          <p>Both links open the <em>same published page</em> using the same Proof Explorer code and MathJax settings. Only the full Explorer proof block differs.</p>
          <p><a href="original.html{query}">A — Published proof</a><a href="isolated.html{query}">B — Separately compiled proof</a></p>
          <p>Compare inference-line lengths, rule-label placement, references, zoom/pan, and Set-I / ∧-Con expansions. The second version was compiled independently by Lwarp.</p>
          <p>These local files are an experiment; the public website is unchanged.</p></body></html>'''
          (out / 'open-this.html').write_text(index_html, encoding='utf-8')

          # Resolve comparison statistics, not just apparent success.
          def proof_commands(text):
              return len(re.findall(r'\\(?:AxiomC|UnaryInfC|BinaryInfC|TrinaryInfC|QuaternaryInfC|QuinaryInfC)\b', text))
          result = {
              'id':identifier,
              'published_inference_commands':proof_commands(published),
              'standalone_inference_commands':proof_commands(compiled),
              'standalone_references_resolved':reference_count,
              'published_fragment_characters':len(published),
              'standalone_fragment_characters':len(compiled),
              'uses_same_published_page':True,
              'isolated_fragment_generated_by_lwarp':True,
              'source_file': json.loads((work/'specimen.json').read_text(encoding='utf-8'))['source_file'],
          }
          if result['published_inference_commands'] != result['standalone_inference_commands']:
              raise SystemExit('Different proof versions: inference step counts do not match. Comparison would be misleading.')
          (out / 'comparison.json').write_text(json.dumps(result, indent=2)+'\n', encoding='utf-8')
          print('ISOLATION: compilation succeeded; A and B have',result['standalone_inference_commands'],'inference commands')
          print('ISOLATION: resolved',reference_count,'LaTeX numbered references')
          print('ISOLATION: output proof-comparison/open-this.html')
          PY

      - name: Record cache verdict in the downloadable comparison
        env:
          CACHE_HIT: ${{ steps.proof-cache.outputs.cache-hit }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import os

          out = Path('proof-comparison')
          key = json.loads(Path('proof-isolate/cache-fingerprint.json').read_text())['key']
          hit = os.environ.get('CACHE_HIT') == 'true'
          result = {'cache_hit':hit, 'lwarp_compilation_skipped':hit, 'cache_key':key}
          (out/'cache-status.json').write_text(json.dumps(result,indent=2)+'\n',encoding='utf-8')
          report = out/'comparison.json'
          comparison = json.loads(report.read_text(encoding='utf-8'))
          comparison.update(result)
          report.write_text(json.dumps(comparison,indent=2)+'\n',encoding='utf-8')
          verdict = 'CACHE HIT — Lwarp proof compilation skipped' if hit else 'CACHE MISS — Lwarp proof compiled and saved'
          print('CACHE RESULT:',verdict)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as summary:
              summary.write('## D.2 individual proof cache\n\n'+verdict+'\n\n')
              summary.write('Cache key: `'+key+'`\n\n')
              summary.write('Download the comparison artifact and open `open-this.html` to verify rendering.\n')
          PY

      - name: Verify the two independently obtained proof fragments
        run: |
          node --check proof-comparison/poc-gentzen.js
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          out = Path('proof-comparison')
          for item in ('open-this.html', 'original.html', 'isolated.html',
                       'fragment-published.html', 'fragment-isolated.html',
                       'poc-gentzen.js', 'comparison.json', 'cache-status.json'):
              assert (out / item).is_file() and (out / item).stat().st_size, item
          result = json.loads((out / 'comparison.json').read_text())
          assert result['standalone_inference_commands'] > 30
          assert result['standalone_inference_commands'] == result['published_inference_commands']
          assert result['standalone_references_resolved'] >= 1
          for file in ('original.html', 'isolated.html'):
              page = (out / file).read_text()
              assert 'poc-gentzen.js' in page
              assert 'stch-poc-registry' in page
              assert 'meta:restricted-unrestricted-class-formulation' in page
          print('VERIFIED: isolated Lwarp and published proof have equal inference counts')
          print('VERIFIED: current proof registry and reference links are available')
          print('VERIFIED: output open-this.html contains side-by-side choices')
          PY

      - name: Downloadable browser experiment
        uses: actions/upload-artifact@v4
        with:
          name: single-proof-cache-comparison
          path: proof-comparison/
          if-no-files-found: error
          retention-days: 7
