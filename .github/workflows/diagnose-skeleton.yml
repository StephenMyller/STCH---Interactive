# Corrected read-only skeleton fingerprint diagnostic.
# Never compiles LaTeX, deploys, or changes the manuscript.
name: STCH - investigate skeleton cache fingerprints (corrected)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare original publish keys and fingerprinted source files
        env:
          OLD_KEY: "stch-book-skeleton-v1-d72e838fe1297ac0d942cdecd73764a99b80611b166db33b5d0e8d5e05b192cc"
          NEW_KEY: "stch-book-skeleton-v1-8013dd281d846583534ad6706d9a20ddeae5f48ffd8606b55d14fee1c5b1a13a"
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from hashlib import sha256
          import io, os, re, subprocess

          OLD = os.environ['OLD_KEY'].strip()
          NEW = os.environ['NEW_KEY'].strip()
          EXTENSIONS = {'.tex', '.sty', '.cls', '.cfg', '.def', '.bib', '.bst',
                        '.png', '.jpg', '.jpeg', '.svg', '.pdf', '.eps'}
          EXCLUDED = {'.git','.github','proof-isolate','proof-package',
                      'staging-proofs','site','staging','main-images',
                      'lateximages','__pycache__'}
          PATTERN = re.compile(
              r'(?P<open>\\begin\{explorerderivation\}\s*\{(?P<id>[^{}\r\n]+)\})'
              r'(?P<body>.*?)'
              r'(?P<close>\\end\{explorerderivation\})', re.S)


          def git(*args):
              p = subprocess.run(['git', *args], stdout=subprocess.PIPE,
                                 stderr=subprocess.PIPE, check=False)
              if p.returncode:
                  raise RuntimeError(f'git {args[:2]} failed: {p.stderr.decode(errors="replace")}')
              return p.stdout


          def eligible(path):
              return (path.suffix.lower() in EXTENSIONS and
                      not any(x in EXCLUDED for x in path.parts) and
                      not path.name.startswith('main_html.'))


          def normalize_chapter(blob, name):
              # The publisher uses Path.read_text() then Path.write_text() on a Linux
              # runner. read_text() performs universal-newline conversion. Git show
              # supplies raw bytes; the first diagnostic missed this conversion.
              with io.TextIOWrapper(io.BytesIO(blob), encoding='utf-8', newline=None) as fp:
                  original = fp.read()
              count = len(list(PATTERN.finditer(original)))
              if count != original.count('\\begin{explorerderivation}') or count != original.count('\\end{explorerderivation}'):
                  raise RuntimeError(f'Unrecognized Explorer environment in {name}')
              return PATTERN.sub(lambda m: m.group('open')+'\n'+m.group('close'), original).encode('utf-8')


          def git_snapshot(rev):
              paths = [p.decode('utf-8') for p in
                       git('ls-tree', '-r', '-z', '--name-only', rev).split(b'\0') if p]
              result = {}
              for name in paths:
                  p = PurePosixPath(name)
                  if not eligible(p):
                      continue
                  blob = git('show', rev + ':' + name)
                  if name.startswith('Chapters/') and p.suffix == '.tex':
                      blob = normalize_chapter(blob, name)
                  result[name] = blob
              return result


          def disk_snapshot():
              # Exactly the same file selection as the production publisher; this
              # function simulates stripping in memory, without changing any files.
              result = {}
              for path in sorted(Path('.').rglob('*')):
                  if not path.is_file() or not eligible(path):
                      continue
                  data = path.read_bytes()
                  if len(path.parts) >= 2 and path.parts[0] == 'Chapters' and path.suffix == '.tex':
                      data = normalize_chapter(data, path.as_posix())
                  result[path.as_posix()] = data
              return result


          def fingerprint(files):
              digest = sha256(b'STCH-STAGING-SKELETON-v1\0')
              for name in sorted(files):
                  path = name.encode('utf-8')
                  data = files[name]
                  digest.update(len(path).to_bytes(4, 'big') + path)
                  digest.update(len(data).to_bytes(8, 'big') + data)
              return 'stch-book-skeleton-v1-' + digest.hexdigest()


          def changes(before, after):
              found = []
              for name in sorted(set(before) | set(after)):
                  old, new = before.get(name), after.get(name)
                  if old == new:
                      continue
                  status = 'modified' if old is not None and new is not None else ('added' if old is None else 'removed')
                  found.append((name, status, sha256(old).hexdigest()[:12] if old is not None else '—',
                                sha256(new).hexdigest()[:12] if new is not None else '—'))
              return found


          commits = git('rev-list', '--first-parent', '-n', '80', 'HEAD').decode().splitlines()
          found = {}
          recent = []
          for rev in commits:
              files = git_snapshot(rev)
              key = fingerprint(files)
              recent.append((rev, key, files))
              if key in (OLD, NEW) and key not in found:
                  found[key] = (rev, files)
              if len(found) == len(set((OLD, NEW))):
                  break

          lines = ['## Skeleton cache diagnostic — corrected, read-only', '']
          for title, target in [('Earlier reported', OLD), ('Later reported', NEW)]:
              info = found.get(target)
              lines.append(f'- **{title} key:** `{target}`')
              lines.append(f'  - ' + (f'Matched commit `{info[0][:12]}`' if info
                                      else 'Not matched among the last 80 first-parent commits'))

          if OLD in found and NEW in found:
              difference = changes(found[OLD][1], found[NEW][1])
              lines += ['', f'### Changed hashed inputs: {len(difference)}', '',
                        '| File | Change | Earlier digest | Later digest |',
                        '|---|---|---|---|']
              for name, kind, before, after in difference:
                  lines.append(f'| `{name}` | {kind} | `{before}` | `{after}` |')
              print('MATCHED BOTH REPORTED KEYS')
              for name, kind, before, after in difference:
                  print('DIFFERENCE:', kind, name, before, after)
          else:
              lines += ['', '### Self-check at current HEAD', '']
              disk_files = disk_snapshot()
              commit_files = git_snapshot('HEAD')
              disk_key = fingerprint(disk_files)
              git_key = fingerprint(commit_files)
              lines += [f'- Current checkout, publisher-equivalent: `{disk_key}`',
                        f'- Current HEAD reconstructed from Git: `{git_key}`',
                        f'- Checkout/Git agreement: **{"YES" if disk_key == git_key else "NO"}**']
              mismatch = changes(commit_files, disk_files)
              if mismatch:
                  lines += ['', '### Files with different checkout and Git-snapshot bytes', '',
                            '| Path | Status | Git | Checkout |', '|---|---|---|---|']
                  for name, kind, a, b in mismatch[:50]:
                      lines.append(f'| `{name}` | {kind} | `{a}` | `{b}` |')
                  print('HEAD CHECKOUT DIFFERS from reconstructed Git snapshot:',len(mismatch),'files')
                  for name, *_ in mismatch[:30]: print('HEAD DIFFERENCE:',name)
              else:
                  print('SELF-CHECK: current checkout and reconstructed Git fingerprint MATCH')
              lines += ['', '### Recent fingerprint transitions', '',
                        '| Commit | Fingerprint | Changed hashed inputs from preceding commit |',
                        '|---|---|---|']
              for index, (rev, key, files) in enumerate(recent[:40]):
                  older = recent[index+1][2] if index+1<len(recent) else files
                  delta = changes(older, files)
                  lines.append(f'| `{rev[:12]}` | `{key}` | '+
                               (', '.join('`'+item[0]+'`' for item in delta[:8]) +
                                (f' (+{len(delta)-8} more)' if len(delta)>8 else '') if delta else 'none')+' |')
              print('COULD NOT MATCH BOTH REPORTED KEYS; check HEAD self-check and recent transitions')

          summary='\n'.join(lines)+'\n'
          print(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as fp:
              fp.write(summary)
          PY
