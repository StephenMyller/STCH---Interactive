# Read-only experiment: compare the finished lightweight textbook skeleton
# built with one or two forced Lwarp HTML passes. Does NOT publish or change caches.
name: STCH - compare one versus two Lwarp passes (preview only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out textbook sources
        uses: actions/checkout@v4

      - name: Prepare identical lightweight skeletons
        run: |
          set -euo pipefail
          mkdir single-pass double-pass
          git archive HEAD | tar -x -C single-pass
          git archive HEAD | tar -x -C double-pass
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Deliberately the same Explorer-body removal as in publish.yml.
          pattern = re.compile(
              r'(?P<open>\\begin\{explorerderivation\}\s*\{(?P<id>[^{}\r\n]+)\})'
              r'(?P<body>.*?)'
              r'(?P<close>\\end\{explorerderivation\})', re.S)
          for variant in ('single-pass', 'double-pass'):
              root = Path(variant)
              count = 0
              for path in sorted((root / 'Chapters').rglob('*.tex')):
                  original = path.read_text(encoding='utf-8')
                  matches = list(pattern.finditer(original))
                  if (len(matches) != original.count('\\begin{explorerderivation}') or
                      len(matches) != original.count('\\end{explorerderivation}')):
                      raise SystemExit(f'Unrecognized Explorer environment in {path}')
                  count += len(matches)
                  stripped = pattern.sub(lambda m: m.group('open')+'\n'+m.group('close'), original)
                  path.write_text(stripped, encoding='utf-8')
              print(f'{variant}: omitted {count} Explorer proof bodies')
              if not count:
                  raise SystemExit('Found no Explorer proof bodies')
          PY

      - name: Build both skeleton variants in isolated directories
        uses: xu-cheng/texlive-action@v3
        with:
          os: alpine
          run: |
            set -eo pipefail
            apk add --no-cache poppler-utils ghostscript
            root="$PWD"
            for variant in single-pass double-pass; do
              (
                cd "$root/$variant"
                started=$SECONDS
                echo "===== BUILDING $variant ====="
                pdflatex -interaction=nonstopmode -halt-on-error main.tex > skeleton-pdf.log 2>&1 || { tail -100 skeleton-pdf.log; exit 1; }
                echo "TIMING $variant pdflatex: $((SECONDS-started))s elapsed"

                first=$SECONDS
                lwarpmk html1 > skeleton-first.log 2>&1 || { tail -100 skeleton-first.log; exit 1; }
                echo "TIMING $variant first html1: $((SECONDS-first))s"

                if [ "$variant" = double-pass ]; then
                  second=$SECONDS
                  lwarpmk html1 > skeleton-second.log 2>&1 || { tail -100 skeleton-second.log; exit 1; }
                  echo "TIMING $variant second html1: $((SECONDS-second))s"
                fi

                image_start=$SECONDS
                lwarpmk limages > skeleton-images.log 2>&1 || { tail -100 skeleton-images.log; exit 1; }
                for attempt in $(seq 1 60); do
                  ready=true
                  for svg in main-images/*.svg; do
                    if [ ! -s "$svg" ] || ! grep -q '</svg>' "$svg"; then ready=false; break; fi
                  done
                  [ "$ready" = true ] && break
                  sleep 1
                done
                for svg in main-images/*.svg; do
                  if [ ! -s "$svg" ] || ! grep -q '</svg>' "$svg"; then
                    echo "Incomplete SVG: $svg"; exit 1
                  fi
                done
                echo "TIMING $variant images and SVG validation: $((SECONDS-image_start))s"

                final=$SECONDS
                lwarpmk html > skeleton-final.log 2>&1 || { tail -100 skeleton-final.log; exit 1; }
                echo "TIMING $variant final html: $((SECONDS-final))s"
                test -s index.html || { echo "Missing index.html in $variant"; exit 1; }
                echo "TIMING $variant SHELL TOTAL: $((SECONDS-started))s"
                echo "===== FINISHED $variant ====="
              )
            done

      - name: Compare resulting HTML, CSS and generated images
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, difflib, os

          def outputs(root):
              root = Path(root)
              files = list(root.glob('*.html')) + list(root.glob('lwarp*.css'))
              for directory in root.iterdir():
                  if directory.is_dir() and (directory.name.endswith('-images') or directory.name == 'lateximages'):
                      files += [p for p in directory.rglob('*') if p.is_file()]
              return {p.relative_to(root).as_posix(): p for p in files}

          one = outputs('single-pass')
          two = outputs('double-pass')
          missing_in_one = sorted(set(two) - set(one))
          missing_in_two = sorted(set(one) - set(two))
          changed = sorted(name for name in set(one) & set(two)
                           if hashlib.sha256(one[name].read_bytes()).digest()
                           != hashlib.sha256(two[name].read_bytes()).digest())
          html_diffs = [x for x in changed if x.endswith('.html')]
          identical = not (missing_in_one or missing_in_two or changed)
          lines = [
              '# Lwarp pass-count experiment', '',
              '**RESULT: ' + ('BYTE-FOR-BYTE IDENTICAL' if identical else 'OUTPUTS DIFFER') + '**', '',
              f'- Single-pass output files: {len(one)}',
              f'- Two-pass output files: {len(two)}',
              f'- Files missing from single pass: {len(missing_in_one)}',
              f'- Files missing from two-pass version: {len(missing_in_two)}',
              f'- Files with different content: {len(changed)}',
              f'- HTML files with different content: {len(html_diffs)}', '',
          ]
          for heading, items in [('Missing from single pass', missing_in_one),
                                 ('Missing from two-pass version', missing_in_two),
                                 ('Changed files', changed)]:
              if items:
                  lines.append('## ' + heading)
                  lines += ['- `' + n + '`' for n in items[:50]]
                  if len(items) > 50:
                      lines.append(f'- ... and {len(items)-50} more')
                  lines.append('')
          if html_diffs:
              name = html_diffs[0]
              before = one[name].read_text(encoding='utf-8', errors='replace').splitlines()
              after = two[name].read_text(encoding='utf-8', errors='replace').splitlines()
              example = list(difflib.unified_diff(before, after,
                                  fromfile='single-pass/'+name,
                                  tofile='double-pass/'+name, lineterm=''))[:100]
              lines += ['## First HTML difference (up to 100 diff lines)', '', '```diff', *example, '```', '']
          if identical:
              lines.append('The two finished skeletons are identical in all compared files. This is strong evidence that the extra forced pass is unnecessary for this source snapshot.')
          else:
              lines.append('Do NOT remove the second pass yet. Inspect the reported differences first; some could be harmless generated metadata, but cross-references or navigation may differ.')
          result = '\n'.join(lines) + '\n'
          Path('lwarp-pass-comparison.md').write_text(result, encoding='utf-8')
          print(result)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write(result)
          PY

      - name: Upload both HTML results for optional inspection
        uses: actions/upload-artifact@v4
        with:
          name: lwarp-single-vs-double-pass-preview
          retention-days: 7
          path: |
            lwarp-pass-comparison.md
            single-pass/*.html
            single-pass/lwarp*.css
            single-pass/*-images/
            single-pass/lateximages/
            double-pass/*.html
            double-pass/lwarp*.css
            double-pass/*-images/
            double-pass/lateximages/
