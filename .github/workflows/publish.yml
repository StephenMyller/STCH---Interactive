# ================================================================
# INTERACTIVE SET THEORY TEXTBOOK — AUTOMATIC WEB PUBLICATION
# ================================================================
# File location: .github/workflows/publish.yml
#
# This version adds timing diagnostics to the LaTeX conversion step.
# It does not change the compilation, caching or deployment behavior.
# ================================================================

name: Publish HTML textbook

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: textbook-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # ==========================================================
      # STEP 1 — GET THE PROJECT FILES
      # ==========================================================
      - name: Get project files
        uses: actions/checkout@v4

      # ==========================================================
      # STEP 2 — RESTORE PREVIOUSLY GENERATED HTML
      # ==========================================================
      # A CSS/JS-only change can reuse previously generated HTML.
      # Any LaTeX-related change produces a new cache key.
      - name: Restore generated HTML
        id: html-cache
        uses: actions/cache@v4
        with:
          path: |
            *.html
            lwarp*.css
            *-images/
            lateximages/
          key: lwarp-html-v4-${{ hashFiles('**/*.tex', '**/*.sty', '**/*.cls', '**/*.bib', '**/*.bst') }}

      # ==========================================================
      # STEP 3 — CONVERT LaTeX TO HTML (IF NECESSARY)
      # ==========================================================
      - name: Convert LaTeX (only when needed)
        if: steps.html-cache.outputs.cache-hit != 'true'
        uses: xu-cheng/texlive-action@v3
        with:
          os: alpine
          run: |
            # TIMING DIAGNOSTICS (new): measure each subcommand.
            # 'date +%s' works with Alpine's BusyBox shell.
            last=$(date +%s)
            mark() {
              now=$(date +%s)
              echo "TIMING: $1 — $((now - last)) seconds"
              last="$now"
            }

            # Install tools needed by the LaTeX build.
            apk add --no-cache poppler-utils ghostscript
            mark "Install poppler-utils and ghostscript"

            # Compile the LaTeX entry-point document.
            # Stop the build if LaTeX encounters a fatal error.
            pdflatex -interaction=nonstopmode -halt-on-error main.tex
            mark "pdflatex"

            lwarpmk html1
            mark "First lwarpmk html1"

            lwarpmk html1
            mark "Second lwarpmk html1"

            lwarpmk limages
            mark "lwarpmk limages command"

            # Wait for Lwarp's background SVG conversions to finish.
            # A valid SVG must contain data and a closing </svg> tag.
            for attempt in $(seq 1 60); do
              ready=true

              for svg in main-images/*.svg; do
                if [ ! -s "$svg" ] || ! grep -q '</svg>' "$svg"; then
                  ready=false
                  break
                fi
              done

              if [ "$ready" = true ]; then
                break
              fi

              sleep 1
            done

            # Never publish empty or incomplete SVG images.
            for svg in main-images/*.svg; do
              if [ ! -s "$svg" ] || ! grep -q '</svg>' "$svg"; then
                echo "ERROR: SVG generation failed: $svg"
                ls -lh main-images/ || true
                exit 1
              fi
            done
            mark "SVG readiness wait and verification"

            lwarpmk html
            mark "Final lwarpmk html"

            test -f index.html
            mark "Check index.html exists"

      # ==========================================================
      # STEP 4 — CHECK THAT HTML IS AVAILABLE
      # ==========================================================
      - name: Check website exists
        run: test -f index.html

      - name: Make generated HTML writable
        run: |
          sudo chown "$(id -u):$(id -g)" ./*.html
          chmod u+w ./*.html

      # Resolve labels inside raw Gentzen prooftree source so the
      # interactive explorer can link references across pages.
      - name: Resolve Gentzen proof references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import json
          pages = sorted(
              p for p in Path('.').glob('*.html')
              if p.name != 'main_html.html'
          )
          numbering = re.compile(
              r'<span\s+class="listmarker"[^>]*>'
              r'(?:(?!</p>).){0,700}?'
              r'<span\s+class="textup">\s*([A-Za-z0-9]+(?:\.[A-Za-z0-9]+)*)\s*</span>'
              r'(?:(?!</p>).){0,350}?'
              r'<a\s+id="(?!autoid-|main-autopage-)([^"]+)"',
              re.S,
          )
          targets = {}
          for page in pages:
              for number, label in numbering.findall(page.read_text(encoding='utf-8')):
                  targets[label] = (number.strip(), page.name)
          # Locate all labeled HTML anchors.
          anchors = {}
          for page in pages:
              html = page.read_text(encoding="utf-8")
              for label in re.findall(r'<a\b[^>]*\bid="([^"]+)"', html):
                  anchors.setdefault(label, page.name)
          trees = re.compile(
              r'(\begin\s*\{prooftree\})(.*?)(\end\s*\{prooftree\})',
              re.S,
          )
          refs = re.compile(r'\ref\s*\{\s*([^{}\s]+)\s*\}')
          hyperrefs = re.compile(
              r'\hyperref\s*\[\s*([^\[\]\s]+)\s*\]\s*\{([^{}]*)\}'
          )
          count = 0
          missing = set()

          for page in pages:
              html = page.read_text(encoding='utf-8')
              def rewrite_tree(match):
                  def rewrite_ref(ref_match):
                      global count
                      label = ref_match.group(1)
                      if label not in targets:
                          missing.add(label)
                          return ref_match.group(0)
                      number, target_page = targets[label]
                      destination = (
                          f'#{label}' if target_page == page.name
                          else f'{target_page}#{label}'
                      )
                      count += 1
                      return rf'\href{{{destination}}}{{{number}}}'
                  def rewrite_hyperref(ref_match):
                      global count
                      label, link_text = ref_match.groups()
                      if label not in anchors:
                          missing.add(label)
                          return ref_match.group(0)
                      filename = anchors[label]
                      destination = (
                          f'#{label}' if filename == page.name
                          else f'{filename}#{label}'
                      )
                      count += 1
                      return rf'\href{{{destination}}}{{{link_text}}}'
                  body = refs.sub(rewrite_ref, match.group(2))
                  body = hyperrefs.sub(rewrite_hyperref, body)
                  return match.group(1) + body + match.group(3)
              updated = trees.sub(rewrite_tree, html)
              index_tag = (
              '<script id="gentzen-reference-index" type="application/json">'
              + json.dumps(targets).replace('</', '<\/')
              + '</script>'
              )
              existing_tag = re.compile(
              r'<script id="gentzen-reference-index" type="application/json">.*?</script>',
              re.S,
              )
              if existing_tag.search(updated):
                  updated = existing_tag.sub(lambda _: index_tag, updated)
              else:
                  updated = updated.replace('</body>', index_tag + '\n</body>')
              if updated != html:
                  page.write_text(updated, encoding='utf-8')
          if missing:
              raise SystemExit(f'Unresolved proof-tree references: {sorted(missing)}')
          print(f'Resolved {count} proof-tree reference(s).')
          PY

      - name: Build Proof Explorer rule registry
        run: python3 scripts/build_proof_registry.py

      # ==========================================================
      # STEP 5 — PREPARE CSS AND JAVASCRIPT REFERENCES
      # ==========================================================
      # This runs even if the HTML was restored from the cache.
      - name: Enable and version website assets
        env:
          ASSET_VERSION: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          version = os.environ["ASSET_VERSION"][:12]
          for page in Path(".").glob("*.html"):
              html = page.read_text(encoding="utf-8")

              # A. Correct old asset paths.
              for old, new in (
                  ("textbook.css", "assets/textbook.css"),
                  ("gentzen-panel.css", "assets/gentzen-panel.css"),
                  ("gentzen.js", "assets/gentzen.js"),
                  ("theme.js", "assets/theme.js"),
              ):
                  html = html.replace(
                      f'href="{old}', f'href="{new}'
                  )
                  html = html.replace(
                      f'src="{old}', f'src="{new}'
                  )

              # B. Ensure required assets are included.
              assets = (
                  (
                      "assets/gentzen-panel.css",
                      '<link rel="stylesheet" href="assets/gentzen-panel.css">',
                      "</head>",
                  ),
                  (
                      "assets/gentzen.js",
                      '<script defer src="assets/gentzen.js"></script>',
                      "</body>",
                  ),
                  (
                      "assets/theme.js",
                      '<script src="assets/theme.js"></script>',
                      "</head>",
                  ),
              )
              for name, tag, position in assets:
                  existing = re.search(
                      rf'(?:href|src)="{re.escape(name)}(?:\?[^"]*)?"',
                      html,
                  )
                  if not existing:
                      html = html.replace(position, tag + position, 1)

              # C. Add commit-based version numbers to CSS/JS URLs.
              pattern = re.compile(
                  r'(?P<prefix>\b(?:href|src)=(?P<q>["\']))'
                  r'(?P<asset>[^"\']+?\.(?:css|js))'
                  r'(?:\?[^"\']*)?(?P=q)'
              )

              def stamp(match):
                  asset = match.group("asset")
                  if not Path(asset).is_file():
                      return match.group(0)
                  return (
                      f'{match.group("prefix")}'
                      f'{asset}?v={version}'
                      f'{match.group("q")}'
                  )
              html = pattern.sub(stamp, html)

              # D. Write the modified HTML atomically.
              temporary = page.with_name(page.name + ".tmp")
              temporary.write_text(html, encoding="utf-8")
              temporary.replace(page)
          PY

      # ==========================================================
      # STEP 6 — ASSEMBLE THE WEBSITE
      # ==========================================================
      - name: Prepare website files
        run: |
          mkdir -p site
          for ext in html css js svg png jpg jpeg gif webp; do
            find . -maxdepth 1 -type f -iname "*.$ext" \
              -exec cp -t site -- {} +
          done
          for dir in *-images images lateximages; do
            if [ -d "$dir" ]; then
              cp -r "$dir" site/
            fi
          done
          cp -r assets site/
          touch site/.nojekyll

      # ==========================================================
      # STEP 7 — CONFIGURE GITHUB PAGES
      # ==========================================================
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # ==========================================================
      # STEP 8 — UPLOAD THE FINISHED WEBSITE
      # ==========================================================
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  # ==========================================================
  # STEP 9 — DEPLOY WEBSITE IN A SEPARATE JOB
  # ==========================================================
  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
