
name: Publish HTML textbook

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: textbook-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Restore generated HTML
        id: html-cache
        uses: actions/cache@v4
        with:
          path: |
            *.html
            lwarp*.css
            *-images/
            lateximages/
          key: lwarp-html-v1-${{ hashFiles('**/*.tex', '**/*.sty', '**/*.cls', '**/*.bib', '**/*.bst') }}

      - name: Convert LaTeX (only when needed)
        if: steps.html-cache.outputs.cache-hit != 'true'
        uses: xu-cheng/texlive-action@v3
        with:
          os: alpine
          run: |
            apk add --no-cache poppler-utils
            pdflatex -interaction=nonstopmode -halt-on-error main.tex
            lwarpmk html
            test -f index.html

      - name: Check website exists
        run: test -f index.html

      - name: Enable and version website assets
        env:
          ASSET_VERSION: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          version = os.environ["ASSET_VERSION"][:12]

          for page in Path(".").glob("*.html"):
              html = page.read_text(encoding="utf-8")

              # Upgrade old references in cached HTML.
              for old, new in (
                  ("textbook.css", "assets/textbook.css"),
                  ("gentzen-panel.css", "assets/gentzen-panel.css"),
                  ("gentzen.js", "assets/gentzen.js"),
                  ("theme.js", "assets/theme.js"),
              ):
                  html = html.replace(
                      f'href="{old}', f'href="{new}'
                  )
                  html = html.replace(
                      f'src="{old}', f'src="{new}'
                  )

              # Ensure custom assets are included.
              assets = (
                  (
                      "assets/gentzen-panel.css",
                      '<link rel="stylesheet" href="assets/gentzen-panel.css">',
                      "</head>",
                  ),
                  (
                      "assets/gentzen.js",
                      '<script defer src="assets/gentzen.js"></script>',
                      "</body>",
                  ),
                  (
                      "assets/theme.js",
                      '<script src="assets/theme.js"></script>',
                      "</head>",
                  ),
              )

              for name, tag, position in assets:
                  existing = re.search(
                      rf'(?:href|src)="{re.escape(name)}(?:\?[^"]*)?"',
                      html,
                  )
                  if not existing:
                      html = html.replace(position, tag + position, 1)

              # Version local CSS and JavaScript references.
              pattern = re.compile(
                  r'(?P<prefix>\b(?:href|src)=(?P<q>["\']))'
                  r'(?P<asset>[^"\']+?\.(?:css|js))'
                  r'(?:\?[^"\']*)?(?P=q)'
              )

              def stamp(match):
                  asset = match.group("asset")

                  if not Path(asset).is_file():
                      return match.group(0)

                  return (
                      f'{match.group("prefix")}'
                      f'{asset}?v={version}'
                      f'{match.group("q")}'
                  )

              html = pattern.sub(stamp, html)

              # Replace safely even if TeX owns the HTML file.
              temporary = page.with_name(page.name + ".tmp")
              temporary.write_text(html, encoding="utf-8")
              temporary.replace(page)

          PY

      - name: Prepare website files
        run: |
          mkdir -p site

          # Copy generated HTML and root-level assets.
          for ext in html css js svg png jpg jpeg gif webp; do
            find . -maxdepth 1 -type f -iname "*.$ext" \
              -exec cp -t site -- {} +
          done

          # Copy generated image directories.
          for dir in *-images images lateximages; do
            if [ -d "$dir" ]; then
              cp -r "$dir" site/
            fi
          done

          # Copy custom CSS and JavaScript.
          cp -r assets site/

          touch site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
