# Stage a complete website from individually cached Gentzen proofs.
# Restores full LaTeX sources AFTER reference resolution to build the rule registry.
# Does not deploy to GitHub Pages or modify any tracked manuscript file.
name: Proof Explorer - cached proofs staged website

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.proofs.outputs.matrix }}
      count: ${{ steps.proofs.outputs.count }}
    steps:
      - name: Get manuscript
        uses: actions/checkout@v4

      - name: Discover and validate complete Explorer proofs
        id: proofs
        env:
          MAX_PROOFS: all
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, os, re

          pattern = re.compile(
              r'\\begin\{explorerderivation\}\s*\{([^{}\r\n]+)\}'
              r'(.*?)\\end\{explorerderivation\}', re.S)
          opening = re.compile(r'\\begin\{explorerderivation\}')
          closing = re.compile(r'\\end\{explorerderivation\}')
          tree_open = re.compile(r'\\begin\s*\{prooftree\}')
          tree_close = re.compile(r'\\end\s*\{prooftree\}')
          all_proofs = []
          for path in sorted(Path('Chapters').rglob('*.tex')):
              source = path.read_text(encoding='utf-8')
              matches = list(pattern.finditer(source))
              if len(matches) != len(opening.findall(source)) or len(matches) != len(closing.findall(source)):
                  raise SystemExit(f'DISCOVERY ERROR: unrecognized explorerderivation in {path}')
              for match in matches:
                  identifier = match.group(1).strip()
                  body = match.group(2)
                  if len(tree_open.findall(body)) != 1 or len(tree_close.findall(body)) != 1:
                      raise SystemExit(f'DISCOVERY ERROR: {identifier} is not one complete prooftree')
                  all_proofs.append({'id': identifier, 'source': path.as_posix()})

          ids = [p['id'] for p in all_proofs]
          if len(set(ids)) != len(ids):
              raise SystemExit('DISCOVERY ERROR: duplicate Explorer proof identifiers')
          if not all_proofs:
              raise SystemExit('DISCOVERY ERROR: no explorerderivations were found')

          # Always include the already-verified D.2 as the first specimen.
          d2 = 'meta:restricted-unrestricted-class-formulation'
          all_proofs.sort(key=lambda proof: (proof['id'] != d2, proof['source'], proof['id']))
          requested = os.environ.get('MAX_PROOFS', '3')
          if requested not in ('3', 'all'):
              raise SystemExit('Select 3 or all proofs')
          selected = all_proofs if requested == 'all' else all_proofs[:3]
          entries = [dict(proof, slot=f'{i:03d}') for i, proof in enumerate(selected)]
          matrix = {'include': entries}
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as stream:
              print('matrix=' + json.dumps(matrix, separators=(',', ':')), file=stream)
              print('count=' + str(len(entries)), file=stream)
          print(f'DISCOVERED: {len(all_proofs)} complete Explorer proofs')
          print(f'SELECTED: {len(entries)} independently cached proofs')
          for entry in entries:
              print(f"  {entry['slot']}  {entry['id']}  ({entry['source']})")
          PY

  proof:
    needs: discover
    runs-on: ubuntu-latest
    name: ${{ matrix.slot }} - ${{ matrix.id }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - name: Get manuscript
        uses: actions/checkout@v4

      - name: Isolate this proof and compute its own fingerprint
        id: fingerprint
        env:
          PROOF_ID: ${{ matrix.id }}
          PROOF_FILE: ${{ matrix.source }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, re, shutil

          project = Path.cwd()
          work = project / 'proof-isolate'
          work.mkdir(exist_ok=True)
          identifier = os.environ['PROOF_ID']
          filename = Path(os.environ['PROOF_FILE'])
          if not filename.is_file() or not filename.is_relative_to(Path('Chapters')):
              raise SystemExit('Invalid or missing proof source file')
          text = filename.read_text(encoding='utf-8')
          pattern = re.compile(
              r'\\begin\{explorerderivation\}\s*\{([^{}\r\n]+)\}'
              r'(.*?)\\end\{explorerderivation\}', re.S)
          matches = [m for m in pattern.finditer(text) if m.group(1).strip() == identifier]
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one {identifier} in {filename}; found {len(matches)}')
          proof_source = matches[0].group(0)
          shutil.copyfile('preamble.tex', work / 'preamble.tex')
          main = ('\\documentclass[leqno]{article}\n'
                  '\\input{preamble}\n\\begin{document}\n'
                  + proof_source + '\n\\end{document}\n')
          (work / 'main.tex').write_text(main, encoding='utf-8')

          # Include only this proof, the relevant LaTeX environment, and compilation
          # inputs. Modifying another proof must not change this fingerprint.
          relevant = [work / 'main.tex', project / 'preamble.tex']
          relevant += [p for glob in ('*.sty', '*.cls', '*.cfg', '*.def')
                       for p in project.glob(glob)]
          pending = [project / 'preamble.tex']
          examined = set()
          while pending:
              current = pending.pop()
              if current in examined:
                  continue
              examined.add(current)
              for name in re.findall(r'\\(?:input|include)\s*\{([^{}]+)\}',
                                     current.read_text(encoding='utf-8')):
                  target = current.parent / name
                  if not target.suffix:
                      target = target.with_suffix('.tex')
                  if target.is_file() and target.resolve().is_relative_to(project.resolve()):
                      relevant.append(target)
                      pending.append(target)
          digest = hashlib.sha256()
          digest.update(b'STCH-PROOF-CACHE-v2;Lwarp-single-proof;texlive-action-v3\0')
          for file in sorted(set(relevant)):
              data = file.read_bytes()
              relative = file.relative_to(project).as_posix().encode('utf-8')
              digest.update(len(relative).to_bytes(4, 'big'))
              digest.update(relative)
              digest.update(len(data).to_bytes(8, 'big'))
              digest.update(data)
          key = 'stch-explorer-v2-' + digest.hexdigest()
          meta = {'id': identifier, 'source_file': filename.as_posix(),
                  'key': key, 'source_sha256': hashlib.sha256(proof_source.encode()).hexdigest()}
          (work / 'proof-meta.json').write_text(json.dumps(meta, indent=2)+'\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as stream:
              print('key=' + key, file=stream)
          print(f'PROOF: {identifier}')
          print(f'FINGERPRINT: {key}')
          PY

      - name: Restore this proof from GitHub Actions cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          key: ${{ steps.fingerprint.outputs.key }}
          path: |
            proof-isolate/index.html
            proof-isolate/lwarp.css
            proof-isolate/lwarp_formal.css
            proof-isolate/lwarp_sagebrush.css
            proof-isolate/sample_project.css
            proof-isolate/cache-manifest.json

      - name: Report cache verdict before compiling
        env:
          HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          if [ "$HIT" = 'true' ]; then
            echo 'CACHE HIT: This proof is unchanged. Skipping TeXLive/Lwarp.'
          else
            echo 'CACHE MISS: Compiling this proof only.'
          fi

      - name: Compile this proof using the existing Lwarp process
        if: steps.cache.outputs.cache-hit != 'true'
        uses: xu-cheng/texlive-action@v3
        with:
          os: alpine
          run: |
            set -eo pipefail
            apk add --no-cache poppler-utils ghostscript
            cd proof-isolate
            pdflatex -interaction=nonstopmode -halt-on-error main.tex > pdf-build.log 2>&1 || { tail -100 pdf-build.log; exit 1; }
            lwarpmk html1 > first-html.log 2>&1 || { tail -100 first-html.log; exit 1; }
            lwarpmk html1 > second-html.log 2>&1 || { tail -100 second-html.log; exit 1; }
            lwarpmk limages > images.log 2>&1 || { tail -100 images.log; exit 1; }
            lwarpmk html > final-html.log 2>&1 || { tail -100 final-html.log; exit 1; }
            test -s index.html || { echo 'Missing isolated Lwarp index.html'; exit 1; }

      - name: Verify the proof fragment and cached checksums
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, html, json, re

          work = Path('proof-isolate')
          meta = json.loads((work/'proof-meta.json').read_text(encoding='utf-8'))
          required = ['index.html', 'lwarp.css', 'lwarp_formal.css',
                      'lwarp_sagebrush.css', 'sample_project.css']
          checksums = {}
          for name in required:
              path = work / name
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f'CACHE ERROR: missing or empty {path}')
              checksums[name] = hashlib.sha256(path.read_bytes()).hexdigest()

          page = (work/'index.html').read_text(encoding='utf-8')
          openings = re.finditer(r'<div\b[^>]*>', page, re.S | re.I)
          div_tags = re.compile(r'<!--.*?-->|<\s*(/?)\s*div\b[^>]*>', re.S | re.I)
          blocks = []
          for opening in openings:
              tag = opening.group(0)
              classes = re.search(r'\bclass\s*=\s*([\'"])(.*?)\1', tag, re.S | re.I)
              if not classes or 'explorerderivation' not in html.unescape(classes.group(2)).split():
                  continue
              if meta['id'] not in html.unescape(tag):
                  continue
              depth, end = 1, None
              for token in div_tags.finditer(page, opening.end()):
                  if token.group(0).startswith('<!--'):
                      continue
                  depth += -1 if token.group(1) else 1
                  if depth == 0:
                      end = token.end()
                      break
              if end is None:
                  raise SystemExit('CACHE ERROR: unclosed Explorer proof element')
              blocks.append(page[opening.start():end])
          if len(blocks) != 1:
              raise SystemExit(f'CACHE ERROR: expected one HTML proof for {meta["id"]}, found {len(blocks)}')
          fragment = blocks[0]
          cmd = r'\\(?:AxiomC|UnaryInfC|BinaryInfC|TrinaryInfC|QuaternaryInfC|QuinaryInfC)\b'
          source_count = len(re.findall(cmd, (work/'main.tex').read_text(encoding='utf-8')))
          html_count = len(re.findall(cmd, fragment))
          if source_count == 0 or source_count != html_count:
              raise SystemExit(f'CACHE ERROR: proof has {source_count} source steps, {html_count} compiled steps')

          manifest = {'key':meta['key'], 'id':meta['id'], 'files':checksums,
                      'inference_commands':html_count}
          file = work / 'cache-manifest.json'
          if file.exists():
              if json.loads(file.read_text(encoding='utf-8')) != manifest:
                  raise SystemExit('CACHE ERROR: restored manifest failed checksum verification')
              print(f'VERIFIED CACHE HIT: {meta["id"]}, {html_count} inferences')
          else:
              file.write_text(json.dumps(manifest, indent=2)+'\n',encoding='utf-8')
              print(f'VERIFIED NEW COMPILATION: {meta["id"]}, {html_count} inferences')
          (work/'fragment.html').write_text(fragment,encoding='utf-8')
          PY

      - name: Save newly compiled proof
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.fingerprint.outputs.key }}
          path: |
            proof-isolate/index.html
            proof-isolate/lwarp.css
            proof-isolate/lwarp_formal.css
            proof-isolate/lwarp_sagebrush.css
            proof-isolate/sample_project.css
            proof-isolate/cache-manifest.json

      - name: Package one independently cached proof
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, os, shutil

          root = Path('proof-isolate')
          destination = Path('proof-package')
          destination.mkdir(exist_ok=True)
          for name in ('index.html', 'fragment.html', 'lwarp.css',
                       'lwarp_formal.css', 'lwarp_sagebrush.css', 'sample_project.css'):
              shutil.copyfile(root/name, destination/name)
          data = json.loads((root/'proof-meta.json').read_text(encoding='utf-8'))
          data['cache_hit'] = os.environ.get('CACHE_HIT') == 'true'
          data['lwarp_skipped'] = data['cache_hit']
          data['inference_commands'] = json.loads((root/'cache-manifest.json').read_text())['inference_commands']
          (destination/'status.json').write_text(json.dumps(data,indent=2)+'\n',encoding='utf-8')
          print(('CACHE HIT' if data['cache_hit'] else 'CACHE MISS')+' — '+data['id'])
          PY

      - name: Upload this proof's output
        uses: actions/upload-artifact@v4
        with:
          name: compiled-proof-${{ matrix.slot }}
          path: proof-package/
          if-no-files-found: error
          retention-days: 7

  staging:
    needs: [discover, proof]
    runs-on: ubuntu-latest
    steps:
      - name: Get manuscript
        uses: actions/checkout@v4

      - name: Omit Explorer proof bodies and fingerprint the lightweight textbook
        id: skeleton
        env:
          PROOF_MATRIX: ${{ needs.discover.outputs.matrix }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, re

          pattern = re.compile(
              r'(?P<open>\\begin\{explorerderivation\}\s*\{(?P<id>[^{}\r\n]+)\})'
              r'(?P<body>.*?)'
              r'(?P<close>\\end\{explorerderivation\})', re.S)
          steps = re.compile(r'\\(?:AxiomC|UnaryInfC|BinaryInfC|TrinaryInfC|QuaternaryInfC|QuinaryInfC)\b')
          expected = {p['id']: p for p in json.loads(os.environ['PROOF_MATRIX'])['include']}
          observed = {}
          omitted_bytes = 0
          for file in sorted(Path('Chapters').rglob('*.tex')):
              original = file.read_text(encoding='utf-8')
              matches = list(pattern.finditer(original))
              if len(matches) != original.count('\\begin{explorerderivation}') or len(matches) != original.count('\\end{explorerderivation}'):
                  raise SystemExit(f'SKELETON ERROR: unrecognized proof environment in {file}')
              for match in matches:
                  identifier = match.group('id').strip()
                  if identifier not in expected or identifier in observed:
                      raise SystemExit(f'SKELETON ERROR: unexpected or duplicate proof {identifier}')
                  whole = match.group(0)
                  observed[identifier] = {
                      'slot': expected[identifier]['slot'],
                      'source_file': file.as_posix(),
                      'source_sha256': hashlib.sha256(whole.encode('utf-8')).hexdigest(),
                      'inferences': len(steps.findall(whole))}
                  omitted_bytes += len(match.group('body').encode('utf-8'))
              # Leave the original HTML environment and its identifier in place.
              # This is an EPHEMERAL GitHub runner copy, never committed.
              stripped = pattern.sub(lambda m: m.group('open')+'\n'+m.group('close'), original)
              file.write_text(stripped, encoding='utf-8')
          if set(observed) != set(expected):
              raise SystemExit(f'SKELETON ERROR: proof coverage mismatch: {set(expected) ^ set(observed)}')
          if not observed or any(e['inferences'] <= 0 for e in observed.values()):
              raise SystemExit('SKELETON ERROR: no proof inferences discovered')
          Path('staging-expected.json').write_text(json.dumps(observed, indent=2)+'\n', encoding='utf-8')

          # Fingerprint the actual stripped manuscript, not its original proof bodies.
          # Hence editing only one Explorer tree does NOT rebuild the book skeleton.
          extensions = {'.tex', '.sty', '.cls', '.cfg', '.def', '.bib', '.bst',
                        '.png', '.jpg', '.jpeg', '.svg', '.pdf', '.eps'}
          tracked = [p for p in Path('.').rglob('*') if p.is_file()
                     and p.suffix.lower() in extensions
                     and not any(part in ('.git','.github','proof-isolate','proof-package',
                                          'staging-proofs','site','staging','main-images',
                                          'lateximages','__pycache__') for part in p.parts)
                     and not p.name.startswith('main_html.')]
          digest = hashlib.sha256(b'STCH-STAGING-SKELETON-v1\0')
          for file in sorted(tracked):
              path = file.as_posix().encode()
              data = file.read_bytes()
              digest.update(len(path).to_bytes(4, 'big')+path)
              digest.update(len(data).to_bytes(8, 'big')+data)
          key = 'stch-book-skeleton-v1-' + digest.hexdigest()
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              print('key='+key, file=out)
          print(f'SKELETON: omitted {len(observed)} proof bodies ({omitted_bytes:,} bytes)')
          print(f'SKELETON CACHE KEY: {key}')
          PY

      - name: Restore lightweight textbook HTML from cache
        id: book-cache
        uses: actions/cache/restore@v4
        with:
          key: ${{ steps.skeleton.outputs.key }}
          path: |
            *.html
            lwarp*.css
            *-images/
            lateximages/

      - name: Report skeleton cache status
        env:
          CACHE_HIT: ${{ steps.book-cache.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = 'true' ]; then
            echo 'SKELETON CACHE HIT: skipping the complete textbook LaTeX/Lwarp build'
          else
            echo 'SKELETON CACHE MISS: compiling the textbook with Explorer bodies omitted'
          fi

      - name: Compile the lightweight textbook through existing Lwarp process
        if: steps.book-cache.outputs.cache-hit != 'true'
        uses: xu-cheng/texlive-action@v3
        with:
          os: alpine
          run: |
            set -eo pipefail
            apk add --no-cache poppler-utils ghostscript
            pdflatex -interaction=nonstopmode -halt-on-error main.tex > skeleton-pdf.log 2>&1 || { tail -100 skeleton-pdf.log; exit 1; }
            lwarpmk html1 > skeleton-first.log 2>&1 || { tail -100 skeleton-first.log; exit 1; }
            lwarpmk html1 > skeleton-second.log 2>&1 || { tail -100 skeleton-second.log; exit 1; }
            lwarpmk limages > skeleton-images.log 2>&1 || { tail -100 skeleton-images.log; exit 1; }
            for attempt in $(seq 1 60); do
              ready=true
              for svg in main-images/*.svg; do
                if [ ! -s "$svg" ] || ! grep -q '</svg>' "$svg"; then ready=false; break; fi
              done
              [ "$ready" = true ] && break
              sleep 1
            done
            for svg in main-images/*.svg; do
              if [ ! -s "$svg" ] || ! grep -q '</svg>' "$svg"; then
                echo "Incomplete SVG: $svg"; exit 1
              fi
            done
            lwarpmk html > skeleton-final.log 2>&1 || { tail -100 skeleton-final.log; exit 1; }
            test -s index.html || { echo 'Missing skeleton index.html'; exit 1; }

      - name: Check scaffold and make generated HTML writable
        run: |
          test -s index.html
          sudo chown "$(id -u):$(id -g)" ./*.html
          chmod u+w ./*.html

      - name: Save lightweight textbook HTML cache
        if: steps.book-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.skeleton.outputs.key }}
          path: |
            *.html
            lwarp*.css
            *-images/
            lateximages/

      - name: Download all independently cached proof fragments
        uses: actions/download-artifact@v4
        with:
          pattern: compiled-proof-*
          path: staging-proofs/
          merge-multiple: false

      - name: Validate and insert every cached prooftree into its original page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, html, json, re

          expected = json.loads(Path('staging-expected.json').read_text(encoding='utf-8'))
          page_files = sorted(p for p in Path('.').glob('*.html') if p.name != 'main_html.html')
          if not page_files: raise SystemExit('STAGING ERROR: no textbook HTML pages')

          # Recognize the actual Lwarp BlockClass; honor nested DIVs.
          start_div = re.compile(r'<div\b[^>]*>', re.I | re.S)
          div_tags = re.compile(r'<!--.*?-->|<\s*(/?)\s*div\b[^>]*>', re.I | re.S)
          classes = re.compile(r'\bclass\s*=\s*(["\'])(.*?)\1', re.I | re.S)
          identifier = re.compile(r'--explorer-id\s*:\s*([^;]+)\s*;', re.I)
          tree = re.compile(r'\\begin\s*\{prooftree\}.*?\\end\s*\{prooftree\}', re.S)
          commands = re.compile(r'\\(?:AxiomC|UnaryInfC|BinaryInfC|TrinaryInfC|QuaternaryInfC|QuinaryInfC)\b')
          def blocks(source):
              for match in start_div.finditer(source):
                  opening = match.group(0)
                  cls = classes.search(opening)
                  if not cls or 'explorerderivation' not in html.unescape(cls.group(2)).split():
                      continue
                  idmatch = identifier.search(html.unescape(opening))
                  if not idmatch: raise SystemExit(f'STAGING ERROR: Explorer missing identifier: {opening[:200]}')
                  depth, finish = 1, None
                  for token in div_tags.finditer(source, match.end()):
                      if token.group(0).startswith('<!--'): continue
                      depth += -1 if token.group(1) else 1
                      if depth == 0:
                          finish = token.start()
                          break
                  if finish is None: raise SystemExit('STAGING ERROR: unclosed Explorer div')
                  yield idmatch.group(1).strip(), match.end(), finish

          assembled = {}
          coverage = {}
          for proof_id, record in expected.items():
              directory = Path('staging-proofs')/('compiled-proof-'+record['slot'])
              status_file = directory/'status.json'
              fragment_file = directory/'fragment.html'
              if not status_file.is_file() or not fragment_file.is_file():
                  raise SystemExit(f'STAGING ERROR: missing packaged proof {proof_id}')
              status = json.loads(status_file.read_text(encoding='utf-8'))
              if (status['id'] != proof_id or status['source_file'] != record['source_file']
                  or status['source_sha256'] != record['source_sha256']):
                  raise SystemExit(f'STAGING ERROR: WRONG OR STALE PROOF {proof_id}')
              source = fragment_file.read_text(encoding='utf-8')
              pieces = tree.findall(source)
              if len(pieces) != 1:
                  raise SystemExit(f'STAGING ERROR: expected one prooftree in {proof_id}')
              proof = pieces[0]
              n = len(commands.findall(proof))
              if n != record['inferences'] or n != status['inference_commands']:
                  raise SystemExit(f'STAGING ERROR: inference mismatch {proof_id}: {n}')
              if proof_id in assembled:
                  raise SystemExit(f'STAGING ERROR: duplicate packaged proof {proof_id}')
              assembled[proof_id] = '<p>\n\n'+proof+'\n\n</p>\n'
              coverage[proof_id] = {'inferences': n, 'cached': status['cache_hit']}

          found = {}
          for page in page_files:
              source = page.read_text(encoding='utf-8')
              entries = list(blocks(source))
              changes = []
              for proof_id, begin, end in entries:
                  if proof_id not in assembled:
                      raise SystemExit(f'STAGING ERROR: unexpected Explorer {proof_id} on {page}')
                  if proof_id in found:
                      raise SystemExit(f'STAGING ERROR: multiple placements for {proof_id}')
                  if tree.search(source[begin:end]):
                      raise SystemExit(f'STAGING ERROR: skeleton already contains tree {proof_id}')
                  if source[begin:end].strip() not in ('',):
                      # Lwarp may emit harmless hidden numbering state or comments.
                      residual = re.sub(r'<!--.*?-->|<span\b[^>]*class="hidden"[^>]*>.*?</span>', '',
                                        source[begin:end], flags=re.S | re.I)
                      if residual.strip():
                          raise SystemExit(f'STAGING ERROR: nonempty scaffold for {proof_id} on {page}: {residual[:200]!r}')
                  changes.append((begin, end, assembled[proof_id]))
                  found[proof_id] = page.name
              for begin, end, fragment in reversed(changes):
                  source = source[:begin] + '\n' + fragment + source[end:]
              if changes:
                  page.write_text(source, encoding='utf-8')
                  print(f'ASSEMBLED: {page.name}: {len(changes)} cached proofs')
          if set(found) != set(assembled):
              raise SystemExit(f'STAGING ERROR: missing HTML placeholders: {set(assembled) ^ set(found)}')
          for key, filename in found.items(): coverage[key]['page'] = filename
          Path('staging-coverage.json').write_text(json.dumps(coverage, indent=2)+'\n', encoding='utf-8')
          print(f'ASSEMBLED: {len(found)} of {len(expected)} proofs, no unfilled placeholders')
          PY

      - name: Resolve Gentzen proof references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import json
          pages = sorted(
              p for p in Path('.').glob('*.html')
              if p.name != 'main_html.html'
          )
          numbering = re.compile(
              r'<span\s+class="listmarker"[^>]*>'
              r'(?:(?!</p>).){0,700}?'
              r'<span\s+class="textup">\s*([A-Za-z0-9]+(?:\.[A-Za-z0-9]+)*)\s*</span>'
              r'(?:(?!</p>).){0,350}?'
              r'<a\s+id="(?!autoid-|main-autopage-)([^"]+)"',
              re.S,
          )
          targets = {}
          for page in pages:
              for number, label in numbering.findall(page.read_text(encoding='utf-8')):
                  targets[label] = (number.strip(), page.name)
          # Locate all labeled HTML anchors.
          anchors = {}
          for page in pages:
              html = page.read_text(encoding="utf-8")
              for label in re.findall(r'<a\b[^>]*\bid="([^"]+)"', html):
                  anchors.setdefault(label, page.name)
          trees = re.compile(
              r'(\\begin\s*\{prooftree\})(.*?)(\\end\s*\{prooftree\})',
              re.S,
          )
          refs = re.compile(r'\\ref\s*\{\s*([^{}\s]+)\s*\}')
          hyperrefs = re.compile(
              r'\\hyperref\s*\[\s*([^\[\]\s]+)\s*\]\s*\{([^{}]*)\}'
          )
          count = 0
          missing = set()

          for page in pages:
              html = page.read_text(encoding='utf-8')
              def rewrite_tree(match):
                  def rewrite_ref(ref_match):
                      global count
                      label = ref_match.group(1)
                      if label not in targets:
                          missing.add(label)
                          return ref_match.group(0)
                      number, target_page = targets[label]
                      destination = (
                          f'#{label}' if target_page == page.name
                          else f'{target_page}#{label}'
                      )
                      count += 1
                      return rf'\href{{{destination}}}{{{number}}}'
                  def rewrite_hyperref(ref_match):
                      global count
                      label, link_text = ref_match.groups()
                      if label not in anchors:
                          missing.add(label)
                          return ref_match.group(0)
                      filename = anchors[label]
                      destination = (
                          f'#{label}' if filename == page.name
                          else f'{filename}#{label}'
                      )
                      count += 1
                      return rf'\href{{{destination}}}{{{link_text}}}'
                  body = refs.sub(rewrite_ref, match.group(2))
                  body = hyperrefs.sub(rewrite_hyperref, body)
                  return match.group(1) + body + match.group(3)
              updated = trees.sub(rewrite_tree, html)
              index_tag = (
              '<script id="gentzen-reference-index" type="application/json">'
              + json.dumps(targets).replace('</', r'<\/')
              + '</script>'
              )
              existing_tag = re.compile(
              r'<script id="gentzen-reference-index" type="application/json">.*?</script>',
              re.S,
              )
              if existing_tag.search(updated):
                  updated = existing_tag.sub(lambda _: index_tag, updated)
              else:
                  updated = updated.replace('</body>', index_tag + '\n</body>')
              if updated != html:
                  page.write_text(updated, encoding='utf-8')
          if missing:
              raise SystemExit(f'Unresolved proof-tree references: {sorted(missing)}')
          print(f'Resolved {count} proof-tree reference(s).')
          PY

      - name: Restore original Explorer sources and build reference-aware rule registry
        run: |
          set -euo pipefail
          # The skeleton conversion needs empty Explorer bodies; the registry
          # needs the original complete LaTeX. GitHub Actions uses an ephemeral
          # checkout, so restoring these files cannot affect the manuscript.
          git restore --source=HEAD --worktree -- Chapters
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, re

          expected = json.loads(Path('staging-expected.json').read_text(encoding='utf-8'))
          pattern = re.compile(
              r'\\begin\{explorerderivation\}\s*\{([^{}\r\n]+)\}'
              r'(.*?)\\end\{explorerderivation\}', re.S)
          found = {}
          for file in sorted(Path('Chapters').rglob('*.tex')):
              source = file.read_text(encoding='utf-8')
              for match in pattern.finditer(source):
                  proof_id = match.group(1).strip()
                  if proof_id not in expected or proof_id in found:
                      raise SystemExit(f'REGISTRY ERROR: unexpected or duplicate proof {proof_id}')
                  record = expected[proof_id]
                  if (record['source_file'] != file.as_posix() or
                      record['source_sha256'] != hashlib.sha256(
                          match.group(0).encode('utf-8')).hexdigest()):
                      raise SystemExit(f'REGISTRY ERROR: source restoration mismatch for {proof_id}')
                  found[proof_id] = True
          if set(found) != set(expected):
              raise SystemExit(f'REGISTRY ERROR: missing original proofs: {set(expected) - set(found)}')
          if not any('gentzen-reference-index' in page.read_text(encoding='utf-8')
                     for page in Path('.').glob('*.html') if page.name != 'main_html.html'):
              raise SystemExit('REGISTRY ERROR: reference index was not generated')
          print(f'REGISTRY: restored all {len(found)} original Explorer proofs; reference index present')
          PY
          python3 scripts/build_proof_registry.py
          test -s assets/proof-rules.json

      - name: Enable and version website assets
        env:
          ASSET_VERSION: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          version = os.environ["ASSET_VERSION"][:12]
          for page in Path(".").glob("*.html"):
              html = page.read_text(encoding="utf-8")

              # A. Correct old asset paths.
              for old, new in (
                  ("textbook.css", "assets/textbook.css"),
                  ("gentzen-panel.css", "assets/gentzen-panel.css"),
                  ("gentzen.js", "assets/gentzen.js"),
                  ("theme.js", "assets/theme.js"),
              ):
                  html = html.replace(
                      f'href="{old}', f'href="{new}'
                  )
                  html = html.replace(
                      f'src="{old}', f'src="{new}'
                  )

              # B. Ensure required assets are included.
              assets = (
                  (
                      "assets/gentzen-panel.css",
                      '<link rel="stylesheet" href="assets/gentzen-panel.css">',
                      "</head>",
                  ),
                  (
                      "assets/gentzen.js",
                      '<script defer src="assets/gentzen.js"></script>',
                      "</body>",
                  ),
                  (
                      "assets/theme.js",
                      '<script src="assets/theme.js"></script>',
                      "</head>",
                  ),
              )
              for name, tag, position in assets:
                  existing = re.search(
                      rf'(?:href|src)="{re.escape(name)}(?:\?[^"]*)?"',
                      html,
                  )
                  if not existing:
                      html = html.replace(position, tag + position, 1)

              # C. Add commit-based version numbers to CSS/JS URLs.
              pattern = re.compile(
                  r'(?P<prefix>\b(?:href|src)=(?P<q>["\']))'
                  r'(?P<asset>[^"\']+?\.(?:css|js))'
                  r'(?:\?[^"\']*)?(?P=q)'
              )

              def stamp(match):
                  asset = match.group("asset")
                  if not Path(asset).is_file():
                      return match.group(0)
                  return (
                      f'{match.group("prefix")}'
                      f'{asset}?v={version}'
                      f'{match.group("q")}'
                  )
              html = pattern.sub(stamp, html)

              # D. Write the modified HTML atomically.
              temporary = page.with_name(page.name + ".tmp")
              temporary.write_text(html, encoding="utf-8")
              temporary.replace(page)
          PY

      # ==========================================================
      # STEP 6 — ASSEMBLE THE WEBSITE
      # ==========================================================
      - name: Prepare website files
        run: |
          mkdir -p site
          for ext in html css js svg png jpg jpeg gif webp; do
            find . -maxdepth 1 -type f -iname "*.$ext" \
              -exec cp -t site -- {} +
          done
          for dir in *-images images lateximages; do
            if [ -d "$dir" ]; then
              cp -r "$dir" site/
            fi
          done
          cp -r assets site/
          touch site/.nojekyll

      # ==========================================================
      # STEP 7 — CONFIGURE GITHUB PAGES
      # ==========================================================
      - name: Make the downloadable preview work in Firefox under file://
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, html
          root = Path('site')
          registry = json.loads((root/'assets/proof-rules.json').read_text(encoding='utf-8'))
          # For staging only: avoid file:// fetch restrictions on the rule registry.
          (root/'assets/staging-registry.js').write_text(
              'window.__STCH_STAGING_RULES='+json.dumps(registry,ensure_ascii=False).replace('</', r'<\/')+';\n',
              encoding='utf-8')
          script = root/'assets/gentzen.js'
          source = script.read_text(encoding='utf-8')
          needle = "const response = await fetch(url, {cache: 'no-store'});"
          if source.count(needle) != 1:
              raise SystemExit('STAGING ERROR: rule registry loader changed; cannot enable offline preview')
          source = source.replace(needle,
              "const response = window.__STCH_STAGING_RULES ? "
              "{ok:true,json:async()=>window.__STCH_STAGING_RULES} "
              ": await fetch(url, {cache:'no-store'});", 1)
          script.write_text(source,encoding='utf-8')
          inject = '<script src="assets/staging-registry.js"></script>'
          for page in root.glob('*.html'):
              source = page.read_text(encoding='utf-8')
              if '</head>' not in source:
                  raise SystemExit(f'STAGING ERROR: page lacks head: {page}')
              source = source.replace('</head>', inject+'\n</head>', 1)
              page.write_text(source, encoding='utf-8')
          PY

      - name: Package website preview and report
        env:
          SKELETON_HIT: ${{ steps.book-cache.outputs.cache-hit }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import html, json, os, shutil
          coverage = json.loads(Path('staging-coverage.json').read_text(encoding='utf-8'))
          root = Path('staging')
          root.mkdir(exist_ok=True)
          shutil.move('site', root/'site')
          items = []
          for proof_id, record in sorted(coverage.items()):
              target = html.escape('site/'+record['page'])
              items.append(f'<li><a href="{target}">{html.escape(proof_id)}</a> '
                           f'— {record["inferences"]} inferences, '
                           f'{"cache hit" if record["cached"] else "compiled"}</li>')
          page = """<!doctype html><html lang="en"><head><meta charset="utf-8">
          <title>STCH staged cached-proof website</title><style>
          body{font:17px/1.5 Georgia,serif;max-width:920px;margin:3rem auto;padding:0 2rem}
          li{margin:.5rem 0}a{color:#24619d}p{max-width:80ch}
          </style></head><body><h1>STCH staged cached-proof website</h1>
          <p>Unpublished preview. All Explorer proofs were inserted from individual Lwarp caches.
          The live GitHub Pages website was not changed.</p>
          <p><a href="site/index.html">Open textbook homepage</a></p>
          <h2>Pages with cached proofs</h2><ul>""" + '\n'.join(items) + """</ul></body></html>"""
          (root/'open-this.html').write_text(page, encoding='utf-8')
          (root/'coverage.json').write_text(json.dumps(coverage,indent=2)+'\n', encoding='utf-8')
          hits = sum(record['cached'] for record in coverage.values())
          verdict = (f'STAGING SUCCESS: {len(coverage)} integrated proofs; '
                     f'{hits} individual proof cache hits; '
                     f'book skeleton cache '+('HIT' if os.environ.get('SKELETON_HIT') == 'true' else 'MISS'))
          print(verdict)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('## Staged cached-proof website\n\n'+verdict+'\n\n')
              summary.write('Download artifact **stch-cached-proof-staging**, unzip, and open `open-this.html`.\n')
          PY

      - name: Upload staged website (NO deployment)
        uses: actions/upload-artifact@v4
        with:
          name: stch-cached-proof-staging
          path: staging/
          if-no-files-found: error
          retention-days: 7
